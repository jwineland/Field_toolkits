<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Field Toolkit Checklist</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --border: #2e3250; --border2: #3d4270; --text: #e8eaf6;
    --text2: #9096b8; --text3: #5a6080; --accent: #5c7cfa;
    --accent-bg: #1a2060; --green: #40c057; --green-bg: #0d2b14;
    --yellow: #fab005; --yellow-bg: #2b2000; --red: #f03e3e;
    --red-bg: #2b0a0a; --purple: #ae3ec9; --purple-bg: #250d2b;
    --radius: 8px; --radius-sm: 5px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
  .app{max-width:960px;margin:0 auto;padding:16px}
  header{padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
  h1{font-size:20px;font-weight:600}
  .subtitle{font-size:12px;color:var(--text3);margin-top:4px}
  .mode-bar{display:flex;margin-bottom:16px;border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;width:fit-content}
  .mode-btn{font-size:13px;padding:7px 18px;background:transparent;border:none;color:var(--text2);cursor:pointer;transition:all .15s}
  .mode-btn.active{background:var(--accent);color:#fff}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:border-color .15s}
  .stat:hover{border-color:var(--border2)} .stat.active-stat{border-color:var(--accent)}
  .stat-label{font-size:11px;color:var(--text3);margin-bottom:4px}
  .stat-value{font-size:22px;font-weight:600}
  .stat-value.green{color:var(--green)} .stat-value.blue{color:var(--accent)}
  .stat-value.yellow{color:var(--yellow)} .stat-value.purple{color:var(--purple)}
  .stat-value.muted{color:var(--text2)}
  .controls{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .search input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)} .search input::placeholder{color:var(--text3)}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .fb{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
  .fb:hover{border-color:var(--accent);color:var(--text)}
  .fb.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
  .sec-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .stab{font-size:12px;padding:6px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;text-align:left}
  .stab:hover{border-color:var(--border2);color:var(--text)}
  .stab.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
  .stab .cnt{font-size:10px;opacity:.7;margin-left:4px}
  .content-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 12px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .sec-header{font-size:15px;font-weight:600;color:var(--text)}
  .header-actions{display:flex;gap:8px}
  .hbtn{font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .list-sec-head{font-size:12px;font-weight:600;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;margin:16px 0 4px}
  .list-sec-head:first-of-type{margin-top:0}
  .subsec-head{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:12px 0 6px;border-top:1px solid var(--border);margin-top:4px}
  .subsec-head:first-of-type{border-top:none;margin-top:0}
  .item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:none}
  .item-thumb-wrap{flex-shrink:0;width:56px;height:56px;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
  .item-thumb-wrap img{width:100%;height:100%;object-fit:contain;display:block}
  .item-thumb-wrap.no-img{color:var(--text3);font-size:18px}
  .item-thumb-wrap.no-img:hover{border-color:var(--border2)}
  .item-left{flex:1;min-width:0}
  .item-name{font-size:13px;color:var(--text);line-height:1.45}
  .item-note{font-size:11px;color:var(--text2);margin-top:3px}
  .item-tier{font-size:10px;color:var(--text3);margin-top:2px}
  .item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
  .item-sec-tag{font-size:10px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
  .badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
  .b-owned{background:var(--green-bg);color:var(--green)} .b-buy{background:var(--accent-bg);color:var(--accent)}
  .b-deferred{background:var(--yellow-bg);color:var(--yellow)} .b-rejected{background:var(--red-bg);color:var(--red)}
  .b-reviewing{background:var(--purple-bg);color:var(--purple)}
  .item-link{font-size:10px;color:var(--accent);text-decoration:none;opacity:.8}
  .item-link:hover{opacity:1}
  .item-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  select.ss{font-size:12px;padding:4px 6px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;width:96px}
  select.ss:focus{outline:none;border-color:var(--accent)}
  .comment-btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0}
  .comment-btn:hover{color:var(--accent)}
  .comment-box{margin-top:6px;width:100%}
  .comment-box textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:6px 8px;resize:vertical;min-height:56px}
  .comment-box textarea:focus{outline:none;border-color:var(--accent)}
  .comment-box .save-btn{margin-top:4px;font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;border:none;cursor:pointer}
  .saved-comment{font-size:11px;color:var(--text2);background:var(--surface2);border-left:2px solid var(--accent);padding:4px 8px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-top:4px;font-style:italic}
  .empty{color:var(--text3);padding:24px 0;text-align:center;font-size:13px}
  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;flex-direction:column;gap:12px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:var(--radius);background:var(--surface)}
  .lightbox-name{color:var(--text2);font-size:13px;text-align:center;max-width:80vw}
  .lightbox-close{position:absolute;top:16px;right:20px;font-size:24px;color:var(--text2);cursor:pointer;background:none;border:none;line-height:1}
  .lightbox-close:hover{color:var(--text)}
  .lightbox-link{font-size:12px;color:var(--accent);text-decoration:none}
  .list-picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .lpick{font-size:13px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
  .lpick:hover{color:var(--text);border-color:var(--border2)}
  .lpick .lcount{font-size:11px;background:var(--surface2);border-radius:10px;padding:1px 7px}
  .lpick.lp-owned.active{border-color:var(--green);background:var(--green-bg);color:var(--green)}
  .lpick.lp-buy.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
  .lpick.lp-reviewing.active{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
  .lpick.lp-deferred.active{border-color:var(--yellow);background:var(--yellow-bg);color:var(--yellow)}
  .lpick.lp-rejected.active{border-color:var(--red);background:var(--red-bg);color:var(--red)}
  .lpick.lp-unset.active{border-color:var(--border2);background:var(--surface2);color:var(--text)}
  @media print{
    .auth-bar,.profile-bar,.mode-bar,.controls,.sec-tabs,.list-picker,.item-right,.actions,.sync-status,.stats,.header-actions,.item-thumb-wrap,.lightbox{display:none!important}
    body{background:#fff;color:#000}
    .list-sec-head{background:#eee;border:1px solid #ccc;color:#000;break-inside:avoid}
    .item{break-inside:avoid;border-bottom:1px solid #ddd}
    .item-name{color:#000;font-size:12px} .item-note{color:#444;font-size:11px}
    .item-tier{color:#888;font-size:10px} .item-sec-tag{background:#f0f0f0;border:1px solid #ccc;color:#444}
    .saved-comment{background:#f5f5f5;border-left:2px solid #999;color:#444}
    .sec-header{color:#000;font-size:16px}
    .content-header{border-bottom:2px solid #000;margin-bottom:12px;padding-bottom:8px}
  }
  .actions{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
  .actions button{flex:1;font-size:13px;padding:9px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s}
  .actions button:hover{border-color:var(--accent);color:var(--accent)}
  .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .actions button.primary:hover{background:#4a6af0}
  .auth-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .auth-bar input{flex:1;min-width:180px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-size:12px}
  .auth-bar input:focus{outline:none;border-color:var(--accent)} .auth-bar input::placeholder{color:var(--text3)}
  .auth-bar button{font-size:12px;padding:6px 14px;border-radius:var(--radius-sm);background:var(--accent);border:none;color:#fff;cursor:pointer}
  .auth-status{font-size:11px;color:var(--text3)} .auth-status.ok{color:var(--green)}
  .profile-bar{display:flex;align-items:center;gap:8px;padding:10px 0;flex-wrap:wrap}
  .profile-bar label{font-size:12px;color:var(--text2);font-weight:600}
  .profile-bar select{background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:7px 10px;font-size:12px}
  .profile-bar button{background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:7px 10px;font-size:12px;cursor:pointer}
  .profile-bar button:hover{border-color:var(--accent);color:var(--text)}
  .profile-note{font-size:11px;color:var(--text3)}
  .sync-status{font-size:11px;color:var(--text3);text-align:right;margin-bottom:8px;min-height:16px}
  .sync-status.err{color:var(--red)} .sync-status.ok{color:var(--green)}
  @media(max-width:500px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .item-right{flex-direction:row;align-items:center}
    .mode-btn{font-size:12px;padding:6px 12px}
    .item-thumb-wrap{width:44px;height:44px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>DC Field Deployment Kit</h1>
    <div class="subtitle">Rev 17 &nbsp;·&nbsp; jwineland/Field_toolkits &nbsp;·&nbsp; Categorize, comment, export</div>
  </header>
  <div class="auth-bar">
    <input type="password" id="pat-input" placeholder="GitHub Personal Access Token (repo scope) — for saving changes">
    <button onclick="saveAuth()">Connect</button>
    <span class="auth-status" id="auth-status">Not connected — changes saved locally only</span>
  </div>
  <div class="profile-bar">
    <label for="profile-select">Toolkit owner</label>
    <select id="profile-select" onchange="switchProfile(this.value)"></select>
    <button id="copy-joel-btn" onclick="copyJoelToolkit()">Copy Joel's toolkit</button>
    <span class="profile-note" id="profile-note">Each owner has independent statuses and notes.</span>
  </div>
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('checklist')">✓ Checklist</button>
    <button class="mode-btn" onclick="setMode('lists')">≡ Status Lists</button>
  </div>
  <div class="stats">
    <div class="stat" onclick="statClick('unset')"><div class="stat-label">Unreviewed</div><div class="stat-value muted" id="s-un">0</div></div>
    <div class="stat" onclick="statClick('owned')"><div class="stat-label">Owned</div><div class="stat-value green" id="s-own">0</div></div>
    <div class="stat" onclick="statClick('buy')"><div class="stat-label">To buy</div><div class="stat-value blue" id="s-buy">0</div></div>
    <div class="stat" onclick="statClick('reviewing')"><div class="stat-label">Reviewing</div><div class="stat-value purple" id="s-rev">0</div></div>
  </div>
  <div id="mode-checklist">
    <div class="controls">
      <div class="search"><input type="search" id="srch" placeholder="Search all items…"></div>
      <div class="filters">
        <button class="fb active" data-f="all">All</button>
        <button class="fb" data-f="unset">Unreviewed</button>
        <button class="fb" data-f="owned">Owned</button>
        <button class="fb" data-f="buy">Buy</button>
        <button class="fb" data-f="deferred">Deferred</button>
        <button class="fb" data-f="reviewing">Reviewing</button>
        <button class="fb" data-f="rejected">Rejected</button>
      </div>
    </div>
    <div class="sec-tabs" id="sec-tabs"></div>
    <div class="sync-status" id="sync-status"></div>
    <div class="content-header"><div class="sec-header" id="sec-header"></div></div>
    <div id="list"></div>
  </div>
  <div id="mode-lists" style="display:none">
    <div class="list-picker" id="list-picker"></div>
    <div class="sync-status" id="sync-status2"></div>
    <div class="content-header">
      <div class="sec-header" id="list-header"></div>
      <div class="header-actions">
        <button class="hbtn" onclick="printList()">🖨 Print</button>
        <button class="hbtn" onclick="exportListCSV()">↓ CSV</button>
      </div>
    </div>
    <div id="status-list"></div>
  </div>
  <div class="actions">
    <button onclick="exportCSV()">Export all CSV</button>
    <button class="primary" onclick="syncToGitHub()">Save to GitHub</button>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="">
  <div class="lightbox-name" id="lb-name"></div>
  <a class="lightbox-link" id="lb-link" href="" target="_blank" rel="noopener"></a>
</div>

<script>
const OWNER='jwineland',REPO='Field_toolkits',STATE_PATH='state.json',BRANCH='main';
let kitData=null,stateDoc={version:2,profiles:{}},state={},comments={},currentProfile='joel',curSec=null,curListStatus='buy',appMode='checklist',filt='all',q='',pat='',openComments={};
const SL=['unset','owned','buy','deferred','reviewing','rejected'];
const LB={unset:'—',owned:'Owned',buy:'Buy',deferred:'Deferred',reviewing:'Reviewing',rejected:'Rejected'};
const LIST_LABELS={owned:'Owned',buy:'Buy List',reviewing:'Reviewing',deferred:'Deferred',rejected:'Rejected',unset:'Unreviewed'};

// Route all images through wsrv.nl proxy — handles CORS for Amazon and other CDNs
// Double-encode the URL so + signs and special chars survive the proxy query string
function proxyImg(url){
  return 'https://wsrv.nl/?w=120&h=120&fit=contain&output=jpg&url='+encodeURIComponent(url);
}

async function init(){
  const r=await fetch('data.json?_='+Date.now());
  kitData=await r.json();
  await loadState();
  buildProfilePicker();
  curSec=kitData.sections[0].id;
  buildTabs();updateStats();render();buildListPicker();
}

function normalizeStateDoc(raw){
  if(raw&&raw.profiles){
    raw.version=2;
    raw.profiles.joel=raw.profiles.joel||{name:'Joel',status:{},comments:{}};
    raw.profiles['chris-b']=raw.profiles['chris-b']||{name:'Chris B.',status:{},comments:{}};
    return raw;
  }
  return {version:2,profiles:{
    joel:{name:'Joel',status:(raw&&raw.status)||{},comments:(raw&&raw.comments)||{}},
    'chris-b':{name:'Chris B.',status:{},comments:{}}
  },updated:(raw&&raw.updated)||new Date().toISOString()};
}

function bindProfile(){
  const p=stateDoc.profiles[currentProfile]||stateDoc.profiles.joel;
  state=p.status||(p.status={});
  comments=p.comments||(p.comments={});
  openComments={};
  localStorage.setItem('fk_current_profile',currentProfile);
  buildProfilePicker();
}

function buildProfilePicker(){
  const sel=document.getElementById('profile-select');
  if(!sel)return;
  sel.innerHTML='';
  Object.entries(stateDoc.profiles).forEach(([id,p])=>{
    const o=document.createElement('option');o.value=id;o.textContent=p.name||id;o.selected=id===currentProfile;sel.appendChild(o);
  });
  document.getElementById('copy-joel-btn').style.display=currentProfile==='joel'?'none':'';
}

function switchProfile(id){
  if(!stateDoc.profiles[id])return;
  currentProfile=id;bindProfile();saveLocal();
  buildTabs();updateStats();buildListPicker();
  if(appMode==='lists')renderStatusList();else render();
  setSyncStatus('Viewing '+stateDoc.profiles[id].name+' toolkit','ok');
}

function copyJoelToolkit(){
  if(currentProfile==='joel')return;
  const target=stateDoc.profiles[currentProfile],source=stateDoc.profiles.joel;
  if((Object.keys(target.status||{}).length||Object.keys(target.comments||{}).length)&&
     !confirm('Replace '+target.name+'\'s current statuses and notes with Joel\'s toolkit?'))return;
  target.status=JSON.parse(JSON.stringify(source.status||{}));
  target.comments=JSON.parse(JSON.stringify(source.comments||{}));
  bindProfile();saveLocal();buildTabs();updateStats();buildListPicker();
  if(appMode==='lists')renderStatusList();else render();
  setSyncStatus('Copied Joel\'s toolkit into '+target.name+' — customize and save when ready','ok');
}

async function loadState(){
  let loaded=null;
  try{
    const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${STATE_PATH}?_=${Date.now()}`);
    if(r.ok)loaded=await r.json();
  }catch(e){}
  if(!loaded){
    const ls=localStorage.getItem('fk_state_v2')||localStorage.getItem('fk_state');
    if(ls)try{loaded=JSON.parse(ls);}catch(e){}
  }
  stateDoc=normalizeStateDoc(loaded||{});
  const preferred=localStorage.getItem('fk_current_profile')||'joel';
  currentProfile=stateDoc.profiles[preferred]?preferred:'joel';
  bindProfile();
  setSyncStatus(loaded?'Loaded toolkit profiles':'Using local storage — connect GitHub to share',loaded?'ok':'');
}

function getItemState(id){return state[id]||'unset';}
function saveLocal(){localStorage.setItem('fk_state_v2',JSON.stringify(stateDoc));}

function decodeGitHubContent(content){
  return decodeURIComponent(escape(atob(content.replace(/\n/g,''))));
}

async function syncToGitHub(){
  if(!pat){alert('Enter a GitHub PAT first.');return;}
  setSyncStatus('Saving '+stateDoc.profiles[currentProfile].name+'...','');
  try{
    let sha=null,remote=normalizeStateDoc({});
    try{
      const r=await ghApi('GET',`contents/${STATE_PATH}`);
      if(r.sha)sha=r.sha;
      if(r.content)remote=normalizeStateDoc(JSON.parse(decodeGitHubContent(r.content)));
    }catch(e){}
    remote.profiles[currentProfile]=JSON.parse(JSON.stringify(stateDoc.profiles[currentProfile]));
    remote.updated=new Date().toISOString();
    const content=JSON.stringify(remote,null,2);
    const body={message:'Update '+remote.profiles[currentProfile].name+' toolkit — '+remote.updated,content:btoa(unescape(encodeURIComponent(content))),branch:BRANCH};
    if(sha)body.sha=sha;
    await ghApi('PUT',`contents/${STATE_PATH}`,body);
    stateDoc=remote;bindProfile();saveLocal();
    setSyncStatus('Saved '+stateDoc.profiles[currentProfile].name+' to GitHub ✓','ok');
  }catch(e){setSyncStatus('Save failed: '+e.message+' — reload and retry if another user saved first','err');}
}

async function ghApi(method,path,body){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${path}`,{
    method,headers:{Authorization:'token '+pat,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(r.status+' '+r.statusText);
  return r.json();
}

function saveAuth(){
  pat=document.getElementById('pat-input').value.trim();
  document.getElementById('pat-input').value='';
  if(pat){document.getElementById('auth-status').textContent='Token set — changes will save to GitHub';document.getElementById('auth-status').className='auth-status ok';}
}

function setSyncStatus(msg,cls){
  ['sync-status','sync-status2'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=msg;el.className='sync-status'+(cls?' '+cls:'');}});
}

function setMode(m){
  appMode=m;
  document.getElementById('mode-checklist').style.display=m==='checklist'?'':'none';
  document.getElementById('mode-lists').style.display=m==='lists'?'':'none';
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',(m==='checklist'&&i===0)||(m==='lists'&&i===1)));
  if(m==='lists'){buildListPicker();renderStatusList();}
  updateStats();
}

function statClick(st){setMode('lists');curListStatus=st;buildListPicker();renderStatusList();updateStats();}

function updateStats(){
  let own=0,buy=0,un=0,rev=0;
  kitData.sections.forEach(s=>s.items.forEach(i=>{
    const st=getItemState(i.id);
    if(st==='owned')own++;if(st==='buy')buy++;if(st==='unset')un++;if(st==='reviewing')rev++;
  }));
  document.getElementById('s-own').textContent=own;
  document.getElementById('s-buy').textContent=buy;
  document.getElementById('s-un').textContent=un;
  document.getElementById('s-rev').textContent=rev;
  document.querySelectorAll('.stat').forEach((el,i)=>{
    const map=['unset','owned','buy','reviewing'];
    el.classList.toggle('active-stat',appMode==='lists'&&map[i]===curListStatus);
  });
}

function buildTabs(){
  const el=document.getElementById('sec-tabs');el.innerHTML='';
  kitData.sections.forEach(sec=>{
    const total=sec.items.length;
    const done=sec.items.filter(i=>getItemState(i.id)!=='unset').length;
    const b=document.createElement('button');
    b.className='stab'+(sec.id===curSec?' active':'');
    b.innerHTML=sec.name.replace(/^\d+ · /,'')+`<span class="cnt">${done}/${total}</span>`;
    b.onclick=()=>{curSec=sec.id;buildTabs();render();};
    el.appendChild(b);
  });
}

function render(){
  const sec=kitData.sections.find(s=>s.id===curSec);
  document.getElementById('sec-header').textContent=sec.name;
  const el=document.getElementById('list');el.innerHTML='';
  const items=sec.items.filter(i=>{
    const mf=filt==='all'||getItemState(i.id)===filt;
    const mq=!q||i.name.toLowerCase().includes(q)||(i.note||'').toLowerCase().includes(q)||(i.tier||'').toLowerCase().includes(q);
    return mf&&mq;
  });
  if(!items.length){el.innerHTML='<div class="empty">No items match.</div>';return;}
  const hasSubs=items.some(i=>i.subsection);
  if(hasSubs){
    const subs=[...new Set(items.map(i=>i.subsection).filter(Boolean))];
    subs.forEach(sub=>{
      const sh=document.createElement('div');sh.className='subsec-head';sh.textContent=sub;el.appendChild(sh);
      items.filter(i=>i.subsection===sub).forEach(i=>el.appendChild(makeItem(i,false)));
    });
    items.filter(i=>!i.subsection).forEach(i=>el.appendChild(makeItem(i,false)));
  }else{items.forEach(i=>el.appendChild(makeItem(i,false)));}
}

function buildListPicker(){
  const el=document.getElementById('list-picker');if(!el)return;
  el.innerHTML='';
  const counts={};SL.forEach(s=>counts[s]=0);
  kitData.sections.forEach(sec=>sec.items.forEach(i=>{counts[getItemState(i.id)]++;}));
  ['buy','reviewing','owned','deferred','unset','rejected'].forEach(st=>{
    const b=document.createElement('button');
    b.className=`lpick lp-${st}`+(st===curListStatus?' active':'');
    b.innerHTML=`${LIST_LABELS[st]} <span class="lcount">${counts[st]}</span>`;
    b.onclick=()=>{curListStatus=st;buildListPicker();renderStatusList();updateStats();};
    el.appendChild(b);
  });
}

function renderStatusList(){
  const el=document.getElementById('status-list');
  const hdr=document.getElementById('list-header');
  if(!el||!hdr)return;
  el.innerHTML='';
  let total=0;
  kitData.sections.forEach(sec=>sec.items.forEach(i=>{if(getItemState(i.id)===curListStatus)total++;}));
  hdr.textContent=`${LIST_LABELS[curListStatus]} — ${total} item${total!==1?'s':''}`;
  let shown=0;
  kitData.sections.forEach(sec=>{
    const items=sec.items.filter(i=>getItemState(i.id)===curListStatus);
    if(!items.length)return;shown+=items.length;
    const sh=document.createElement('div');sh.className='list-sec-head';
    sh.textContent=sec.name+` (${items.length})`;el.appendChild(sh);
    items.forEach(i=>el.appendChild(makeItem(i,true)));
  });
  if(!shown)el.innerHTML=`<div class="empty">No items tagged as "${LIST_LABELS[curListStatus]}" yet.</div>`;
}

function printList(){window.print();}

function exportListCSV(){
  const rows=['Section,Item,Note,Tier,Status,Comment,URL'];
  kitData.sections.forEach(sec=>{
    sec.items.filter(i=>getItemState(i.id)===curListStatus).forEach(i=>{
      rows.push(`"${sec.name}","${i.name.replace(/"/g,"'")}","${(i.note||'').replace(/"/g,"'")}","${i.tier||''}","${LB[getItemState(i.id)]}","${(comments[i.id]||'').replace(/"/g,"'")}","${i.url||''}"`);
    });
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download=`field-kit-${curListStatus}.csv`;a.click();
}

function openLightbox(i){
  if(!i.image)return;
  document.getElementById('lb-img').src=proxyImg(i.image);
  document.getElementById('lb-img').alt=i.name;
  document.getElementById('lb-name').textContent=i.name;
  const lnk=document.getElementById('lb-link');
  if(i.url){lnk.href=i.url;lnk.textContent='View product page ↗';lnk.style.display='';}
  else lnk.style.display='none';
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e){
  if(!e||e.target===document.getElementById('lightbox')||e.target.classList.contains('lightbox-close')){
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lb-img').src='';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});

function makeThumb(i){
  const wrap=document.createElement('div');
  if(i.image){
    wrap.className='item-thumb-wrap';
    wrap.title='Click to enlarge';
    const img=document.createElement('img');
    img.loading='lazy';
    img.src=proxyImg(i.image);
    img.alt=i.name;
    // On error: show link icon if URL exists, else box
    img.onerror=()=>{
      wrap.className='item-thumb-wrap no-img';
      wrap.innerHTML=i.url?'🔗':'📦';
      if(i.url)wrap.onclick=()=>window.open(i.url,'_blank','noopener');
      else wrap.style.cursor='default';
    };
    wrap.appendChild(img);
    wrap.onclick=()=>openLightbox(i);
  } else if(i.url){
    wrap.className='item-thumb-wrap no-img';
    wrap.title='View product page';
    wrap.innerHTML='🔗';
    wrap.onclick=()=>window.open(i.url,'_blank','noopener');
  } else {
    wrap.className='item-thumb-wrap no-img';
    wrap.innerHTML='📦';
    wrap.style.cursor='default';
  }
  return wrap;
}

function makeItem(i,listMode){
  const st=getItemState(i.id);
  const secName=listMode?kitData.sections.find(s=>s.items.some(x=>x.id===i.id))?.name:null;
  const d=document.createElement('div');d.className='item';d.id='item-'+i.id;
  d.appendChild(makeThumb(i));
  const left=document.createElement('div');left.className='item-left';
  left.innerHTML=`<div class="item-name">${i.name}</div>${i.note?`<div class="item-note">${i.note}</div>`:''}<div class="item-tier">${i.tier||''}</div>`;
  const meta=document.createElement('div');meta.className='item-meta';
  if(st!=='unset')meta.innerHTML+=`<span class="badge b-${st}">${LB[st]}</span>`;
  if(listMode&&secName)meta.innerHTML+=`<span class="item-sec-tag">${secName.replace(/^\d+ · /,'')}</span>`;
  if(i.subsection)meta.innerHTML+=`<span class="item-sec-tag">${i.subsection}</span>`;
  if(i.url)meta.innerHTML+=`<a class="item-link" href="${i.url}" target="_blank" rel="noopener">↗ product</a>`;
  if(meta.innerHTML)left.appendChild(meta);
  if(comments[i.id]){const cd=document.createElement('div');cd.className='saved-comment';cd.textContent='💬 '+comments[i.id];left.appendChild(cd);}
  if(openComments[i.id]){
    const cb=document.createElement('div');cb.className='comment-box';
    const ta=document.createElement('textarea');ta.placeholder='Add a comment or note…';ta.value=comments[i.id]||'';
    const sb=document.createElement('button');sb.className='save-btn';sb.textContent='Save';
    sb.onclick=()=>{
      const v=ta.value.trim();if(v)comments[i.id]=v;else delete comments[i.id];
      openComments[i.id]=false;saveLocal();
      if(appMode==='lists')renderStatusList();else render();
    };
    cb.appendChild(ta);cb.appendChild(sb);left.appendChild(cb);
  }
  const right=document.createElement('div');right.className='item-right';
  const sel=document.createElement('select');sel.className='ss';
  SL.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=LB[s];if(s===st)o.selected=true;sel.appendChild(o);});
  sel.onchange=e=>{
    state[i.id]=e.target.value;saveLocal();updateStats();buildTabs();buildListPicker();
    if(appMode==='lists')renderStatusList();
    else{const ex=document.getElementById('item-'+i.id);if(ex)ex.replaceWith(makeItem(i,false));updateStats();buildTabs();}
  };
  const cbtn=document.createElement('button');cbtn.className='comment-btn';
  cbtn.textContent=comments[i.id]?'✎ note':'+ note';
  cbtn.onclick=()=>{openComments[i.id]=!openComments[i.id];if(appMode==='lists')renderStatusList();else render();};
  right.appendChild(sel);right.appendChild(cbtn);
  d.appendChild(left);d.appendChild(right);
  return d;
}

document.getElementById('srch').addEventListener('input',e=>{
  q=e.target.value.toLowerCase();
  if(q){
    document.getElementById('sec-header').textContent='Search results';
    const el=document.getElementById('list');el.innerHTML='';
    kitData.sections.forEach(sec=>{
      const items=sec.items.filter(i=>{
        const mf=filt==='all'||getItemState(i.id)===filt;
        const mq=i.name.toLowerCase().includes(q)||(i.note||'').toLowerCase().includes(q)||(i.tier||'').toLowerCase().includes(q);
        return mf&&mq;
      });
      if(!items.length)return;
      const sh=document.createElement('div');
      sh.style.cssText='font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:12px 0 6px;border-top:1px solid var(--border);margin-top:4px';
      sh.textContent=sec.name;el.appendChild(sh);
      items.forEach(i=>el.appendChild(makeItem(i,false)));
    });
  }else render();
});

document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
  filt=b.dataset.f;
  document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  if(q)document.getElementById('srch').dispatchEvent(new Event('input'));else render();
}));

function exportCSV(){
  const rows=['Section,Subsection,Item,Note,Tier,Status,Comment,URL'];
  kitData.sections.forEach(s=>s.items.forEach(i=>{
    rows.push(`"${s.name}","${i.subsection||''}","${i.name.replace(/"/g,"'")}","${(i.note||'').replace(/"/g,"'")}","${i.tier||''}","${LB[getItemState(i.id)]}","${(comments[i.id]||'').replace(/"/g,"'")}","${i.url||''}"`);
  }));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='field-kit-all.csv';a.click();
}

init();
</script>
