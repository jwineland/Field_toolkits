<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill:#111; }
    .title { font-size:30px; font-weight:700; }
    .label { font-size:19px; font-weight:700; }
    .small { font-size:16px; }
    .bar { fill:#d9e5ef; stroke:#315b7d; stroke-width:3; }
    .target { fill:#b7d8b7; }
    .ceiling { stroke:#b32020; stroke-width:4; stroke-dasharray:10 7; }
  </style>
  <text x="50" y="55" class="title">Transport Cart — Package Weight Architecture</text>
  <text x="50" y="90" class="small">Human-factors requirement: every individually handled package should target 45–48 lb and never exceed 50 lb.</text>

  <line x1="900" y1="120" x2="900" y2="470" class="ceiling"/>
  <text x="900" y="105" text-anchor="middle" class="label" fill="#b32020">50 lb HARD CEILING</text>

  <text x="50" y="175" class="label">Pelican Air 1595</text>
  <rect x="150" y="145" width="750" height="55" rx="8" class="bar"/>
  <rect x="825" y="145" width="75" height="55" class="target"/>
  <text x="165" y="180" class="small">~13.6 lb bare + organization + ~30–33 lb content budget</text>

  <text x="50" y="285" class="label">NANUK 935</text>
  <rect x="150" y="255" width="750" height="55" rx="8" class="bar"/>
  <rect x="825" y="255" width="75" height="55" class="target"/>
  <text x="165" y="290" class="small">~11.6 lb bare + heavy roll(s) + ~31–34 lb content budget</text>

  <text x="50" y="395" class="label">R6 cart / accessory package</text>
  <rect x="150" y="365" width="675" height="55" rx="8" class="bar"/>
  <text x="165" y="400" class="small">preferred ≤45 lb including lightweight docking structures / bag; no tools</text>

  <text x="50" y="490" class="label">Operating rule</text>
  <text x="50" y="520" class="small">Use a dedicated luggage scale. Dense/low-frequency tools should move between packages or be selectively carried rather than allowing any one case to grow toward 60–70 lb.</text>
</svg>
